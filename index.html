  const pct = spent / budgetTotal * 100;
  if (pct >= 100) return "over";
  if (pct >= WARN_THRESHOLD) return "warn";
  return "ok";
}

/* ---- Supabase <-> local state mapping ---- */
function mapItem(r) { return { id: r.id, name: r.name, description: r.description || "" }; }
function mapBudget(r, items) {
  const it = items.find(function(i){ return i.id === r.item_id; });
  return { itemId: r.item_id, item: it ? it.name : "", year: r.year, monthly: r.monthly };
}
function mapExpense(r) {
  return { id: r.id, date: r.date, item: r.item, desc: r.description || "", amount: Number(r.amount) || 0, pr: r.pr || "", po: r.po || "", checklist: r.checklist || { deNghi:false, pheDuyet:false, hoaDon:false } };
}

async function fetchAllData() {
  const [itemsRes, budgetsRes, expensesRes] = await Promise.all([
    sb.from("budget_items").select("*").order("created_at"),
    sb.from("budget_allocations").select("*"),
    sb.from("budget_expenses").select("*").order("date", { ascending: false }),
  ]);
  if (itemsRes.error) throw itemsRes.error;
  if (budgetsRes.error) throw budgetsRes.error;
  if (expensesRes.error) throw expensesRes.error;

  let items = itemsRes.data.map(mapItem);
  if (items.length === 0) {
    const seeded = await sb.from("budget_items").insert(defaultItems).select();
    if (seeded.error) throw seeded.error;
    items = seeded.data.map(mapItem);
  }
  const budgets = budgetsRes.data.map(function(r) { return mapBudget(r, items); });
  const expenses = expensesRes.data.map(mapExpense);
  return { items: items, budgets: budgets, expenses: expenses };
}

/* ---- Sync status badge + write helper ---- */
function showSyncing() {
  const el = document.getElementById("savebadge");

function showSaved() {
  const el = document.getElementById("savebadge");

}
function showSyncError() {
  const el = document.getElementById("savebadge");
  if (el) el.innerHTML = '<span class="sync-dot err"></span> Lỗi lưu, thử lại';
}
async function withSync(promise) {
  showSyncing();
  try {
    const res = await promise;
    if (res && res.error) throw res.error;
    showSaved();
    return res;
  } catch (e) {
    console.error(e);
    showSyncError();
    throw e;
  }
}

/* ============================ HELPERS ============================ */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c) { return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]; });
}
function formatVND(n) {
  if (n === null || n === undefined || isNaN(n)) return "0 ₫";
  return new Intl.NumberFormat("vi-VN").format(Math.round(n)) + " ₫";
}
function formatVNDShort(n) {
  if (Math.abs(n) >= 1e9) return (n/1e9).toFixed(2).replace(/\.00$/,"") + " tỷ";
  if (Math.abs(n) >= 1e6) return (n/1e6).toFixed(0) + " tr";
  return formatVND(n);
}
function formatThousands(n) {
  if (n === "" || n === null || n === undefined) return "";
  const num = typeof n === "string" ? Number(n.replace(/[^\d-]/g,"")) : n;
  if (isNaN(num)) return "";
  return new Intl.NumberFormat("vi-VN").format(num);
}
function parseThousands(str) {
  const negative = /^\s*-/.test(String(str));
  const digits = String(str).replace(/[^\d]/g,"");
  if (digits === "") return 0;
  return (negative ? -1 : 1) * Number(digits);
}
function getYearBudgets() { return state.budgets.filter(function(b){ return b.year === state.year; }); }
function getYearExpenses() { return state.expenses.filter(function(e){ return e.date.indexOf(String(state.year)) === 0; }); }
function getItemNames() {
  const set = new Set(state.items.map(function(i){ return i.name; }));
  state.expenses.forEach(function(e){ set.add(e.item); });
  return Array.from(set);
}
function itemDescByName(name) {
  const it = state.items.find(function(i){ return i.name === name; });
  return it ? it.description : "";
}
function computeTotals() {
  const yb = getYearBudgets(), ye = getYearExpenses();
  const totalBudget = yb.reduce(function(s,b){ return s + b.monthly.reduce(function(a,c){return a+c;},0); }, 0);
  const totalSpent = ye.reduce(function(s,e){ return s + Number(e.amount||0); }, 0);
  return { totalBudget: totalBudget, totalSpent: totalSpent, remaining: totalBudget-totalSpent, pctUsed: totalBudget>0 ? totalSpent/totalBudget*100 : 0 };
}
function computeByItem() {
  const yb = getYearBudgets(), ye = getYearExpenses();
  return getItemNames().map(function(name) {
    const b = yb.find(function(x){ return x.item===name; });
    const budgetTotal = b ? b.monthly.reduce(function(a,c){return a+c;},0) : 0;
    const spent = ye.filter(function(e){ return e.item===name; }).reduce(function(s,e){ return s+Number(e.amount||0); },0);
    return { item:name, budgetTotal: budgetTotal, spent: spent, remaining: budgetTotal-spent };
  }).filter(function(d){ return d.budgetTotal>0 || d.spent>0; });
}
function computeByItemMonthly() {
  const yb = getYearBudgets(), ye = getYearExpenses();
  return getItemNames().map(function(name) {
    const b = yb.find(function(x){ return x.item===name; });
    const budgetMonthly = b ? b.monthly.slice() : Array(12).fill(0);
    const spentMonthly = Array(12).fill(0);
    ye.filter(function(e){ return e.item===name; }).forEach(function(e) {
      const idx = parseInt(e.date.split("-")[1],10)-1;
      if (idx>=0 && idx<12) spentMonthly[idx] += Number(e.amount||0);
    });
    const remainingMonthly = budgetMonthly.map(function(v,i){ return v - spentMonthly[i]; });
    return {
      item: name, budgetMonthly: budgetMonthly, spentMonthly: spentMonthly, remainingMonthly: remainingMonthly,
      budgetTotal: budgetMonthly.reduce(function(a,c){return a+c;},0),
      spentTotal: spentMonthly.reduce(function(a,c){return a+c;},0),
      remainingTotal: remainingMonthly.reduce(function(a,c){return a+c;},0)
    };
  }).filter(function(d){ return d.budgetTotal>0 || d.spentTotal>0; });
}
function computeByMonth() {
  const yb = getYearBudgets(), ye = getYearExpenses();
  return MONTHS.map(function(m, idx) {
    const spent = ye.filter(function(e){ return parseInt(e.date.split("-")[1],10)-1 === idx; }).reduce(function(s,e){ return s+Number(e.amount||0); },0);
    const budgetForMonth = yb.reduce(function(s,b){ return s + (b.monthly[idx]||0); }, 0);
    return { month:m, spent: spent, budget: budgetForMonth };
  });
}

/* ============================ SVG CHART HELPERS ============================ */
function barChartSVG(data, opts) {
  const w = (opts && opts.width) || 900, h = (opts && opts.height) || 280;
  const padL = 70, padR = 10, padT = 10, padB = 30;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const allVals = [];
  data.forEach(function(d){ d.values.forEach(function(v){ allVals.push(v.val); }); });
  const maxVal = Math.max.apply(null, [1].concat(allVals));
  const groupW = innerW / data.length;
  const seriesCount = data[0] ? data[0].values.length : 1;
  const barW = Math.min(28, groupW / (seriesCount+1.2));
  let bars = "";
  let gridLines = "";
  const steps = 4;
  for (let i=0;i<=steps;i++) {
    const y = padT + innerH - (innerH/steps)*i;
    const val = (maxVal/steps)*i;
    gridLines += '<line x1="'+padL+'" y1="'+y+'" x2="'+(w-padR)+'" y2="'+y+'" stroke="#EDE8DC" stroke-width="1"/>';
    gridLines += '<text x="'+(padL-8)+'" y="'+(y+4)+'" font-size="10" fill="#7A7163" text-anchor="end">'+formatVNDShort(val)+'</text>';
  }
  data.forEach(function(d, gi) {
    const groupX = padL + gi*groupW;
    d.values.forEach(function(v, si) {
      const bh = (v.val/maxVal)*innerH;
      const bx = groupX + (groupW - seriesCount*barW)/2 + si*barW;
      const by = padT + innerH - bh;
      bars += '<rect x="'+bx+'" y="'+by+'" width="'+(barW-3)+'" height="'+Math.max(0,bh)+'" fill="'+v.color+'" rx="3"><title>'+esc(d.label)+' — '+esc(v.key)+': '+formatVND(v.val)+'</title></rect>';
    });
    bars += '<text x="'+(groupX+groupW/2)+'" y="'+(h-10)+'" font-size="11" fill="#7A7163" text-anchor="middle">'+esc(d.label)+'</text>';
  });
  return '<svg class="svg-chart" viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="xMidYMid meet">'+gridLines+bars+'</svg>';
}

function hbarChartSVG(data, opts) {
  const rowH = 38, padL = 220, padR = 90, padT = 10, padB = 10;
  const w = (opts && opts.width) || 900;
  const h = padT + padB + data.length*rowH;
  const innerW = w - padL - padR;
  const allVals = [];
  data.forEach(function(d){ d.values.forEach(function(v){ allVals.push(v.val); }); });
  const maxVal = Math.max.apply(null, [1].concat(allVals));
  let bars = "";
  data.forEach(function(d, i) {
    const y0 = padT + i*rowH;
    bars += '<text x="'+(padL-12)+'" y="'+(y0+rowH/2+4)+'" font-size="12" fill="#1A2433" text-anchor="end">'+esc(d.item)+'</text>';
    const barH = 12, gap = 4;
    d.values.forEach(function(v, si) {
      const bw = (v.val/maxVal)*innerW;
      const by = y0 + (rowH - (barH*2+gap))/2 + si*(barH+gap);
      bars += '<rect x="'+padL+'" y="'+by+'" width="'+Math.max(0,bw)+'" height="'+barH+'" fill="'+v.color+'" rx="3"><title>'+esc(d.item)+' — '+esc(v.key)+': '+formatVND(v.val)+'</title></rect>';
      bars += '<text x="'+(padL+bw+6)+'" y="'+(by+barH-2)+'" font-size="10" fill="#9A9182">'+formatVNDShort(v.val)+'</text>';
    });
  });
  return '<svg class="svg-chart" viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="xMidYMid meet">'+bars+'</svg>';
}

          '<thead><tr><th>Ngày</th><th>Commitment Item</th><th style="min-width:170px">Mô tả hạng mục</th><th style="min-width:170px">Diễn giải khoản chi</th>' +
            '<th style="text-align:right">Số tiền</th><th>Số PR</th><th>Số PO</th>' +
            '<th style="text-align:center">Đề nghị TT</th><th style="text-align:center">Phê duyệt</th><th style="text-align:center">Hóa đơn</th>' +
            '<th style="text-align:center">Trạng thái</th><th></th></tr></thead>' +
          '<tbody>' + (rows || '<tr><td colspan="12" style="padding:20px;text-align:center;color:#9A9182">Chưa có khoản chi nào. Bấm "Thêm khoản chi" để bắt đầu.</td></tr>') + '</tbody>' +
        '</table>' +
      '</div>' +
    '</div>'
  );
}

/* ============================ EVENT HANDLERS ============================ */
const FIELD_TO_COLUMN = { desc: "description", date: "date", item: "item", pr: "pr", po: "po" };
const amountSaveTimers = {};
function scheduleAmountSave(id, raw) {
  clearTimeout(amountSaveTimers[id]);
  amountSaveTimers[id] = setTimeout(function() {
    withSync(sb.from("budget_expenses").update({ amount: raw }).eq("id", id)).catch(function(){});
  }, 500);
}

function attachHandlers() {
  const main = document.getElementById("mainContent");

  Array.prototype.forEach.call(main.querySelectorAll("[data-month-input]"), function(inp) {
    inp.addEventListener("change", function() {
      const itemId = inp.getAttribute("data-item-id");
      const idx = Number(inp.getAttribute("data-month-idx"));
      const item = state.items.find(function(i){ return i.id===itemId; });
      let b = getYearBudgets().find(function(x){ return x.itemId===itemId; });
      const val = Number(inp.value) || 0;
      let monthly;
      if (b) {
        b.monthly[idx] = val;
        monthly = b.monthly;
      } else {
        monthly = Array(12).fill(0);
        monthly[idx] = val;
        state.budgets.push({ itemId: itemId, item: item.name, year: state.year, monthly: monthly });
      }
      renderMain();
      withSync(sb.from("budget_allocations").upsert({ item_id: itemId, year: state.year, monthly: monthly }, { onConflict: "item_id,year" })).catch(function(){});
    });
  });

  Array.prototype.forEach.call(main.querySelectorAll("[data-toggle-item]"), function(btn) {
    btn.addEventListener("click", function() {
      const id = btn.getAttribute("data-toggle-item");
      state.expandedItemId = state.expandedItemId === id ? null : id;
      renderMain();
    });
  });

  Array.prototype.forEach.call(main.querySelectorAll("[data-desc-input]"), function(ta) {
    ta.addEventListener("change", function() {
      const id = ta.getAttribute("data-item-id");
      const it = state.items.find(function(i){ return i.id===id; });
      if (it) it.description = ta.value;
      withSync(sb.from("budget_items").update({ description: ta.value }).eq("id", id)).catch(function(){});
    });
  });

  Array.prototype.forEach.call(main.querySelectorAll("[data-delete-item]"), function(btn) {
    btn.addEventListener("click", function() {
      const id = btn.getAttribute("data-delete-item");
      const name = btn.getAttribute("data-item-name");
      const linkedExpenses = state.expenses.filter(function(e){ return e.item === name; }).length;
      if (linkedExpenses > 0) {
        window.alert('Không thể xóa "'+name+'" vì còn '+linkedExpenses+' khoản chi đang tham chiếu đến hạng mục này. Hãy chuyển các khoản chi đó sang hạng mục khác trước.');
        return;
      }
      if (!window.confirm('Xóa commitment item "'+name+'"? Ngân sách liên quan sẽ bị xóa.')) return;
      withSync(sb.from("budget_items").delete().eq("id", id)).then(function() {
        state.items = state.items.filter(function(i){ return i.id!==id; });
        state.budgets = state.budgets.filter(function(b){ return b.itemId!==id; });
        if (state.expandedItemId === id) state.expandedItemId = null;
        renderMain();
      }).catch(function(){});
    });
  });

  const toggleAddBtn = document.getElementById("toggleAddForm");
  if (toggleAddBtn) toggleAddBtn.addEventListener("click", function() { state.showAddForm = !state.showAddForm; renderMain(); });
  const submitBtn = document.getElementById("submitNewItem");
  if (submitBtn) submitBtn.addEventListener("click", function() {
    const name = document.getElementById("newItemName").value.trim();
    const desc = document.getElementById("newItemDesc").value.trim();
    if (!name) return;
    withSync(sb.from("budget_items").insert({ name: name, description: desc }).select().single()).then(function(res) {
      state.items.push(mapItem(res.data));
      state.showAddForm = false;
      renderMain();
    }).catch(function(){});
  });
  const cancelBtn = document.getElementById("cancelNewItem");
  if (cancelBtn) cancelBtn.addEventListener("click", function() { state.showAddForm = false; renderMain(); });

  const addExpBtn = document.getElementById("addExpenseBtn");
  if (addExpBtn) addExpBtn.addEventListener("click", function() {
    const names = getItemNames();
    const row = { date: state.year+"-01-01", item: names[0] || "Khác", description: "", amount: 0, pr: "", po: "", checklist: { deNghi:false, pheDuyet:false, hoaDon:false } };
    withSync(sb.from("budget_expenses").insert(row).select().single()).then(function(res) {
      state.expenses.push(mapExpense(res.data));
      renderMain();
    }).catch(function(){});
  });

  const acctMonthFilter = document.getElementById("acctMonthFilter");
  if (acctMonthFilter) acctMonthFilter.addEventListener("change", function() {
    state.acctFilterMonth = acctMonthFilter.value;
    renderMain();
  });
  const acctItemFilter = document.getElementById("acctItemFilter");
  if (acctItemFilter) acctItemFilter.addEventListener("change", function() {
    state.acctFilterItem = acctItemFilter.value;
    renderMain();
  });

  Array.prototype.forEach.call(main.querySelectorAll("[data-field]"), function(inp) {
    const evt = inp.tagName === "SELECT" ? "change" : (inp.getAttribute("data-field")==="amount" ? "input" : "change");
    inp.addEventListener(evt, function() {
      const id = inp.getAttribute("data-id");
      const field = inp.getAttribute("data-field");
      const e = state.expenses.find(function(x){ return x.id===id; });
      if (!e) return;
      if (field === "amount") {
        const caret = inp.selectionStart;
        const digitsBeforeCaret = inp.value.slice(0, caret).replace(/\D/g, "").length;
        const raw = parseThousands(inp.value);
        e.amount = raw;
        const formatted = formatThousands(raw);
        if (inp.value !== formatted) {
          inp.value = formatted;
          let seen = 0, pos = formatted.length;
          for (let i = 0; i < formatted.length; i++) {
            if (/\d/.test(formatted[i])) seen++;
            if (seen === digitsBeforeCaret) { pos = i + 1; break; }
          }
          if (digitsBeforeCaret === 0) pos = 0;
          inp.setSelectionRange(pos, pos);
        }
        scheduleAmountSave(id, raw);
        return;
      }
      e[field] = inp.value;
      const column = FIELD_TO_COLUMN[field] || field;
      const payload = {};
      payload[column] = inp.value;
      withSync(sb.from("budget_expenses").update(payload).eq("id", id)).catch(function(){});
      if (field === "item") renderMain();
    });
  });

  Array.prototype.forEach.call(main.querySelectorAll("[data-toggle-check]"), function(btn) {
    btn.addEventListener("click", function() {
      const id = btn.getAttribute("data-id");
      const key = btn.getAttribute("data-toggle-check");
      const e = state.expenses.find(function(x){ return x.id===id; });
      if (!e) return;
      e.checklist = e.checklist || {};
      e.checklist[key] = !e.checklist[key];
      renderMain();
      withSync(sb.from("budget_expenses").update({ checklist: e.checklist }).eq("id", id)).catch(function(){});
    });
  });

  Array.prototype.forEach.call(main.querySelectorAll("[data-delete-expense]"), function(btn) {
    btn.addEventListener("click", function() {
      const id = btn.getAttribute("data-delete-expense");
      if (!window.confirm("Xóa khoản chi này? Hành động này không thể hoàn tác.")) return;
      withSync(sb.from("budget_expenses").delete().eq("id", id)).then(function() {
        state.expenses = state.expenses.filter(function(e){ return e.id!==id; });
        renderMain();
      }).catch(function(){});
    });
  });
}

/* ============================ AUTH ============================ */
let currentUserEmail = null;
let realtimeChannel = null;

function renderLogin(errorMsg) {
  document.getElementById("root").innerHTML =
    '<div class="login-screen"><div class="login-card">' +
      '<div class="eyebrow">VinFast · Bộ phận PKT</div>' +
      '<div class="title">Kiểm soát Ngân sách &amp; Chi tiêu</div>' +
      '<label>Email</label><input type="email" id="loginEmail" autocomplete="username" />' +
      '<label>Mật khẩu</label><input type="password" id="loginPassword" autocomplete="current-password" />' +
      '<button class="btn-primary" id="loginBtn">Đăng nhập</button>' +
      (errorMsg ? '<div class="login-error">'+esc(errorMsg)+'</div>' : '') +
    '</div></div>';
  const submit = function() {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    sb.auth.signInWithPassword({ email: email, password: password }).then(function(res) {
      if (res.error) renderLogin(res.error.message);
    });
  };
  document.getElementById("loginBtn").addEventListener("click", submit);
  document.getElementById("loginPassword").addEventListener("keydown", function(e) { if (e.key === "Enter") submit(); });
}

function renderLoadError(err) {
  document.getElementById("root").innerHTML =
    '<div class="login-screen"><div class="login-card">' +
      '<div class="title" style="color:#B23B3B">Không tải được dữ liệu</div>' +
      '<div class="login-error">'+esc(err && err.message ? err.message : String(err))+'</div>' +
      '<button class="btn-secondary" id="retryBtn" style="margin-top:16px;width:100%">Thử lại</button>' +
    '</div></div>';
  document.getElementById("retryBtn").addEventListener("click", bootApp);
}

async function bootApp() {
  document.getElementById("root").innerHTML = '<div class="login-screen">Đang tải dữ liệu…</div>';
  try {
    const loaded = await fetchAllData();
    state.items = loaded.items;
    state.budgets = loaded.budgets;
    state.expenses = loaded.expenses;
    renderShell();
    subscribeRealtime();
  } catch (err) {
    renderLoadError(err);
  }
}

function subscribeRealtime() {
  if (realtimeChannel) sb.removeChannel(realtimeChannel);
  realtimeChannel = sb.channel("budget-sync")
    .on("postgres_changes", { event: "*", schema: "public", table: "budget_items" }, refetchAndRender)
    .on("postgres_changes", { event: "*", schema: "public", table: "budget_allocations" }, refetchAndRender)
    .on("postgres_changes", { event: "*", schema: "public", table: "budget_expenses" }, refetchAndRender)
    .subscribe();
}
let refetchTimer = null;
function refetchAndRender() {
  // Coalesce bursts of change events (e.g. a delete cascading to other rows)
  // into a single refetch instead of one per row.
  clearTimeout(refetchTimer);
  refetchTimer = setTimeout(function() {
    fetchAllData().then(function(loaded) {
      state.items = loaded.items;
      state.budgets = loaded.budgets;
      state.expenses = loaded.expenses;
      renderMain();
    }).catch(function(e) { console.error(e); });
  }, 400);
}

/* ============================ INIT ============================ */
sb.auth.onAuthStateChange(function(event, session) {
  if (session && session.user) {
    currentUserEmail = session.user.email;
    bootApp();
  } else {
    currentUserEmail = null;
    if (realtimeChannel) { sb.removeChannel(realtimeChannel); realtimeChannel = null; }
    renderLogin();
  }
});
</script>
